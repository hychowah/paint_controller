name: CI

on:
  push:
    branches: [dev, refactor, dev-cpp, main]
  pull_request:
    branches: [dev, refactor, dev-cpp, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install "ruff>=0.4.0,<0.17"

      - name: Ruff check
        run: ruff check python/ tests/

      - name: Ruff format check
        run: ruff format --check python/ tests/

  qmllint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Run qmllint (warn-only)
        run: |
          find python/paint_controller/qml -name '*.qml' -print0 | xargs -0 qmllint -I python/paint_controller/qml

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TD-045: Qt/xcb + hidapi for PySide6/hid wheels. No GStreamer:
      # requirements-ci omits PyGObject so conftest can stub gi (installing
      # PyGObject without GIR is worse for test collection).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libhidapi-dev

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Pyright
        run: pyright

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libhidapi-dev

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=paint_controller --cov-report=xml --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop
    # No `needs:` — the colcon gate must run even while lint is red (TD-034).
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/paint_controller_ros2

      - name: Install ROS2 dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select paint_controller_ros2
        shell: bash
