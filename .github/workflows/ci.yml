name: CI

on:
  push:
    branches: [refactor, dev-cpp, main]
  pull_request:
    branches: [refactor, dev-cpp, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff check
        run: ruff check python/ tests/

      - name: Ruff format check
        run: ruff format --check python/ tests/

  qmllint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Run qmllint (warn-only)
        run: |
          find python/paint_controller/qml -name '*.qml' -print0 | xargs -0 qmllint -I python/paint_controller/qml

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r python/paint_controller/requirements.txt
          pip install -r requirements-dev.txt

      - name: Pyright
        run: pyright

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r python/paint_controller/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=paint_controller --cov-report=xml --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/paint_controller_ros2

      - name: Install ROS2 dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select paint_controller_ros2
        shell: bash
