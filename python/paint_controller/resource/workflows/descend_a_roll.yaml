schema_version: 2
name: descend_a_roll
description: Descend and Roll
loop: false
steps:
- id: open_valve
  kind: action
  type: valve_turn
  params:
    turn_value: 5.6
  continue: wait_complete
- id: main_winch_descent
  kind: action
  type: winch_absolute
  params:
    length: 2200
    speed: 200
    acceleration: 10
  continue: wait_complete
- id: close_valve
  kind: action
  type: valve_turn
  params:
    turn_value: 0
  continue: wait_complete
  timing:
    mode: before_complete
    offset_ms: 500
    reference: main_winch_descent
