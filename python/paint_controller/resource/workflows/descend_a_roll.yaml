name: descend_a_roll
description: Descend and Roll
loop: false
actions:
- id: open_valve
  name: open_valve
  type: valve_turn
  params:
    turn_value: 5.6
  estimated_duration: 2000
  wait_for_completion: true
- id: main_winch_descent
  name: winch_move
  type: winch_absolute
  params:
    length: 2200
    speed: 200
    acceleration: 10
  wait_for_completion: true
- id: close_valve
  name: close_valve
  type: valve_turn
  params:
    turn_value: 0
  trigger:
    reference_action: main_winch_descent
    timing_mode: before_complete
    offset_ms: 500
  estimated_duration: 1000
  wait_for_completion: true
