schema_version: 2
name: spray_cycle
description: Complete spray cycle with descent and ascent
loop: true
steps:
- id: open_valve
  kind: action
  type: valve_turn
  params:
    turn_value: 3
  continue: wait_complete
- id: descend
  kind: action
  type: winch_absolute
  params:
    length: 2360
    speed: 250
    acceleration: 10
  continue: wait_complete
  timing:
    mode: after_start
    offset_ms: 2000
    reference: open_valve
- id: close_valve
  kind: action
  type: valve_turn
  params:
    turn_value: 0
  continue: wait_complete
  timing:
    mode: before_complete
    offset_ms: 500
    reference: descend
- id: ascend
  kind: action
  type: winch_absolute
  params:
    length: 7670
    speed: 200
    acceleration: 10
  continue: wait_complete
  timing:
    mode: on_complete
    offset_ms: 1500
    reference: descend
