name: spray_cycle
description: Complete spray cycle with descent and ascent
loop: true
actions:
- id: open_valve
  name: open_valve
  type: valve_turn
  params:
    turn_value: 3
  estimated_duration: 500
- id: descend
  name: descend_to_target
  type: winch_absolute
  params:
    length: 2360
    speed: 250
    acceleration: 10
  trigger:
    reference_action: open_valve
    timing_mode: after_start
    offset_ms: 2000
- id: close_valve
  name: close_valve
  type: valve_turn
  params:
    turn_value: 0
  trigger:
    reference_action: descend
    timing_mode: before_complete
    offset_ms: 500
  estimated_duration: 500
- id: ascend
  name: ascend_to_top
  type: winch_absolute
  params:
    length: 7790
    speed: 200
    acceleration: 10
  trigger:
    reference_action: descend
    timing_mode: on_complete
    offset_ms: 1500
