# C3SPRAY PAINT SYSTEM CONFIGURATION
# =================================

# DEVICE CONFIGURATION
EF_DEVICE_NAME="EF"                    # Display name for EF device
EF_IP="192.168.101.211"
EF_SSH_TARGET="c3paintjetson@192.168.101.211"

BASE_DEVICE_NAME="Base Robot"          # Display name for Base device  
BASE_IP="192.168.101.11"
BASE_SSH_TARGET="c3spraypi2@192.168.101.11"

# TMUX SESSION NAMES
MAIN_SESSION_NAME="paint_system"
EF_SESSION_NAME="paint_ef_system"
BASE_SESSION_NAME="paint_base_system"

# REMOTE TMUX SESSION NAMES
REMOTE_EF_SESSION_NAME="ef"            # Tmux session name on EF device
REMOTE_BASE_SESSION_NAME="base"        # Tmux session name on Base device

# DATA RECORDING SETTINGS
ROS_BAG_INTERVAL=30
ROS_BAG_PATH="~/Documents"

# SYSTEM PATHS
ROS2_WORKSPACE="~/ros2_ws"
PAINT_CONTROLLER_PATH="src/paint_controller_ros2/paint_controller"

# TIMEOUT SETTINGS
PING_TIMEOUT=2
SSH_TIMEOUT=10
COMPONENT_RESTART_DELAY=1.5

# UI SETTINGS
PROGRESS_DELAY=0.1
DIALOG_WIDTH=70
DIALOG_HEIGHT=20

# LOGGING
LOG_LEVEL="INFO"
LOG_PATH="/tmp/paint_system.log"