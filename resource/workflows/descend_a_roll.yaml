# Simple paint workflow trajectory - Refactored Version
# Uses improved timing model with clearer semantics

name: "descend_a_roll"
description: "Descend and Roll"

actions:
  # Step 3: Open valve to start painting
  - id: "open_valve"
    name: "open_valve"
    type: "valve_turn"
    params:
      turn_value: 4.8  # 0-100 scale
    estimated_duration: 2000  
    wait_for_completion: true

  # Step 4: Move winch to painting position
  - id: "main_winch_descent"
    name: "winch_move"
    type: "winch_absolute"
    params:
      length: 900  # mm (target position)
      speed: 250    # mm/s
    wait_for_completion: true
    # Duration auto-calculated: 1000mm / 100mm/s = 10 seconds

  # Step 5: Close valve before winch completes
  - id: "close_valve"
    name: "close_valve"
    type: "valve_turn"
    params:
      turn_value: 0.0
    trigger:
      reference_action: "main_winch_descent"  # Reference by ID
      timing_mode: "before_complete"          # Execute before reference completes
      offset_ms: 3000                         # 3 seconds before completion
    estimated_duration: 500  # ms
    wait_for_completion: true
